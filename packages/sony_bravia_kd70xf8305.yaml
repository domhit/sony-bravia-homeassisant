              - conditions: "{{ option == 'AV' }}"
                sequence: [{action: script.sony_bravia_kd70xf8305_av}]
              - conditions: "{{ option == 'Onkyo via CEC' }}"
                sequence: [{action: script.sony_bravia_kd70xf8305_onkyo_cec}]
              - conditions: "{{ option == 'PlayStation 3 via CEC' }}"
