                sequence: [{action: script.sony_bravia_kd70xf8305_hdmi_1}]
              - conditions: "{{ option == 'HDMI 2' }}"
                sequence: [{action: script.sony_bravia_kd70xf8305_hdmi_2}]
              - conditions: "{{ option == 'HDMI 3 - Onkyo' }}"
                sequence: [{action: script.sony_bravia_kd70xf8305_hdmi_3}]
              - conditions: "{{ option == 'HDMI 4 - PS4' }}"
