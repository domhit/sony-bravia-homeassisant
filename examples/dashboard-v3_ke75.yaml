title: Sony KE-75XH9005
views:
  - title: KE-75XH9005
    path: ke75xh9005
    icon: mdi:television
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Sony BRAVIA KE-75XH9005
            icon: mdi:television
            heading_style: title
          - show_name: false
            show_icon: true
            type: button
            icon: mdi:power-plug-outline
            show_state: false
            tap_action:
              action: toggle
            entity: switch.power_meter_plug_1
          - type: tile
            entity: media_player.ke_75xh9005
            name: KE-75XH9005
            hide_state: false
            icon: mdi:television
          - type: button
            icon: mdi:power
            show_name: false
            show_state: false
            tap_action:
              action: perform-action
              perform_action: remote.send_command
              target:
                entity_id: remote.ke_75xh9005_remote
              data:
                command: TvPower
          - type: markdown
            title: Aktueller Inhalt
            content: >-
              {% set e = 'sensor.ke75_current_content' %}

              **Quelle:** {{ states(e) }}

              {% if state_attr(e,'programTitle') %} **Sendung:** {{
              state_attr(e,'programTitle') }} {% endif %}

              {% if state_attr(e,'mediaType') %} **Typ:** {{
              state_attr(e,'mediaType') }} {% endif %}
          - type: entities
            title: Einstellungen
            entities:
              - entity: select.ke_75xh9005_sound_output
                name: Audioausgabe
          - type: custom:mushroom-template-card
            entity: media_player.kd_70xf8305
            primary: Lautstärke
            secondary: >
              {{ (state_attr('media_player.ke_75xh9005', 'volume_level') * 100)
              | round(0) }} 
            icon: mdi:volume-high
            grid_options:
              columns: 12
              rows: 1
      - type: grid
        cards:
          - type: heading
            heading: Quellen
            icon: mdi:video-input-hdmi
          - type: grid
            columns: 3
            square: false
