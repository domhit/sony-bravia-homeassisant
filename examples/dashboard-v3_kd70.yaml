title: Sony KD-70XF8305
views:
  - title: KD-70XF8305
    path: kd70xf8305
    icon: mdi:television
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Sony BRAVIA KD-70XF8305
            icon: mdi:television
            heading_style: title
          - show_name: false
            show_icon: true
            type: button
            icon: mdi:power-plug-outline
            show_state: false
            tap_action:
              action: toggle
            entity: switch.tasmota_3
          - type: tile
            entity: media_player.kd_70xf8305_2
            name: KD-70XF8305
            hide_state: false
            icon: mdi:television
          - type: button
            icon: mdi:power
            show_name: false
            show_state: false
            tap_action:
              action: perform-action
              perform_action: remote.send_command
              target:
                entity_id: remote.kd_70xf8305_remote
              data:
                command: TvPower
          - type: markdown
            title: Aktueller Inhalt
            content: >-
              {% set e = 'sensor.kd70_current_content' %}

              **Quelle:** {{ states(e) }}

              {% if state_attr(e,'programTitle') %} **Sendung:** {{
              state_attr(e,'programTitle') }} {% endif %}

              {% if state_attr(e,'mediaType') %} **Typ:** {{
              state_attr(e,'mediaType') }} {% endif %}
          - type: entities
            title: Einstellungen
            entities:
              - entity: select.kd_70xf8305_sound_output
              - entity: number.kd_70xf8305_brightness
          - type: custom:mushroom-template-card
            entity: media_player.kd_70xf8305
            primary: Lautstärke
            secondary: >
              {{ (state_attr('media_player.kd_70xf8305_2', 'volume_level') *
              100) | round(0) }} 
            icon: mdi:volume-high
            grid_options:
              columns: 12
              rows: 1
      - type: grid
        cards:
          - type: heading
            heading: Quellen
            icon: mdi:video-input-hdmi
          - type: grid
            columns: 3
            square: false
            cards:
              - type: button
                icon: mdi:television
                show_name: false
                show_state: false
                tap_action:
                  action: call-service
                  service: media_player.select_source
                  target:
                    entity_id: media_player.kd_70xf8305_2
                  data:
                    source: TV
              - type: button
                icon: mdi:sony-playstation
