      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Sony BRAVIA KE-75XH9005
            icon: mdi:television
            heading_style: title
            badges:
              - type: entity
                entity: binary_sensor.sony_bravia_ke_75xh9005_power
                show_state: true
                color: green
              - type: entity
                entity: sensor.sony_bravia_ke_75xh9005_audio_output
